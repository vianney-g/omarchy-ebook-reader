name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest
        run: python -m json.tool manifest.json >/dev/null
      - name: Check helper
        run: python -m py_compile ebook-tool
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check reader JavaScript
        run: node --check web/app.js
      - name: Verify starter books
        working-directory: starter-books
        run: |
          sha256sum --check SHA256SUMS
          for book in *.epub; do unzip -tqq "$book"; done
      - name: Reject personal absolute paths
        run: |
          if git grep -I -n -E '(/home/[[:alnum:]_.-]+/|/Users/[[:alnum:]_.-]+/|[A-Za-z]:\\Users\\)' -- ':!.github/workflows/verify.yml'; then
            echo "Personal absolute path found in tracked text"
            exit 1
          fi
